# A five-factor example: value, quality, momentum and low volatility, z-score combined, quarterly, 50 names.
name: multifactor_example
data_source:
  name: synthetic
  params:
    seed: 42
start: 1990-12-31
end: 2024-12-31
factors:
  earnings_yield: 0.3
  gross_profitability: 0.25
  momentum_12_1: 0.2
  volatility_12m: 0.15
  accruals: 0.1
ranking_method: zscore
missing_policy: median
top_n: 50
weighting: equal
frequency: quarterly
annual_month: 12
sleeves: true
costs:
  kind: size
split_date: 2010-12-31
